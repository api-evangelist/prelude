name: Prelude
description: 'Prelude Security is now Origin, an endpoint AI observability platform that inventories,
  observes, and measures the use of AI agents and Model Context Protocol (MCP) servers across an
  enterprise fleet. Deployed as a lightweight endpoint agent, Origin gives security and IT teams
  discovery of sanctioned and unsanctioned agents and MCP servers, security visibility into agent
  prompts, tool calls, file access and network activity, and spend tracking across models and teams.
  Origin also publishes a hosted, OAuth 2.1-secured MCP server that lets agents query endpoint and
  agent observability data in natural language. Backed by Insight Partners.'
